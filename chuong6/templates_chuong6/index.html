
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Quản lý sinh viên{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #263248;
        }

        header {
            background: #2457d6;
            color: white;
            padding: 22px 8%;
        }

        header h2 {
            margin: 0;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 22px;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px #0000000c;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat {
            flex: 1;
            min-width: 180px;
            background: #edf3ff;
            padding: 20px;
            border-radius: 10px;
        }

        .stat h3 {
            color: #2457d6;
            font-size: 28px;
            margin: 8px 0;
        }

        .btn {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 7px;
            background: #2457d6;
            color: white;
            text-decoration: none;
            margin-right: 8px;
        }

        .btn:hover {
            background: #173fa8;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 650px;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #e6e9ef;
            text-align: left;
        }

        th {
            background: #edf3ff;
            color: #2457d6;
        }

        tr:hover {
            background: #f8faff;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #7b8495;
        }

        @media(max-width: 600px) {
            header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>QUẢN LÝ SINH VIÊN</h2>

    <nav>
        <a href="/">Trang chủ</a>
        <a href="/them-mau">Thêm dữ liệu mẫu</a>
        <a href="/thu-truy-van">Truy vấn</a>
    </nav>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer>
    Flask + SQLAlchemy | Chương 6
</footer>

</body>
</html>
